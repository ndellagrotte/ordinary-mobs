plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.0'
}

group = root_package

base {
    archivesName = mod_id
}

def accessTransformerNames = access_transformers.tokenize()
def mixinConfigs = mixin_configs.tokenize(',')*.trim().findAll { !it.isEmpty() }.join(',')
def dependOnHei = depend_on_hei.toBoolean()
def heiDependency = { dependOnHei ? it.requires('had-enough-items') : it.optional('had-enough-items') }
def jerCoordinate = "curse.maven:just-enough-resources-jer-240630:${jer_file_id}"
def runWithJer = run_with_jer.toBoolean()

configurations {
    // Mod jars only the dev client loads, through -Dcrl.dev.extrapath: raw (SRG-named) jars, which Cleanroom remaps
    // as it loads them. It extends nothing and nothing extends it, so they stay off the compile and test classpaths.
    devRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

conventions {
    if (mod_authors) {
        author = mod_authors
    }
    mods {
        if (curseforge_project_id) {
            curseforge {
                projectId = curseforge_project_id
                heiDependency(it)
            }
        }
        if (modrinth_project_id) {
            modrinth {
                projectId = modrinth_project_id
                heiDependency(it)
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC'
                url 'https://maven.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'mezz'
        }
    }
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version) {
        accessTransformers.from(accessTransformerNames.collect { "src/main/resources/META-INF/$it" })
    }
    if (dependOnHei) {
        implementation 'mezz:jei:4.36.1:dev'
    } else {
        runtimeOnly 'mezz:jei:4.36.1:dev'
    }
    // Optional at runtime. Only jeresources.api is referenced, which has no SRG-named members, so the raw jar will do
    compileOnly jerCoordinate
    if (runWithJer) {
        devRuntimeMods jerCoordinate
    }
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                jvmArgs extra_jvm_args.tokenize()
                if (mixinConfigs) {
                    // Cleanroom reads this in dev to register mixin configs that would otherwise come from the jar manifest
                    jvmArgs "-Dcrl.dev.mixin=${mixinConfigs}"
                }
                if (runWithJer) {
                    systemProperty 'crl.dev.extrapath', configurations.devRuntimeMods.elements.map { jars ->
                        jars.collect { it.asFile.absolutePath }.join(File.pathSeparator)
                    }
                }
            }
        }
        server {
            configure {
                jvmArgs extra_jvm_args.tokenize()
                if (mixinConfigs) {
                    jvmArgs "-Dcrl.dev.mixin=${mixinConfigs}"
                }
            }
        }
    }
}

tokenEnvoy {
    set 'MOD_VERSION', project.version
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set file('tokens.properties')
}

jar {
    manifest {
        // Marks the jar as Cleanroom-only so legacy Forge skips it instead of failing on Java 25 classes
        attributes 'Implementation-Vendor': mod_authors, 'Specification-Vendor': mod_authors
        attributes 'ModType': 'CRL'
        if (mixinConfigs) {
            attributes 'MixinConfigs': mixinConfigs
        }
        if (accessTransformerNames) {
            attributes 'FMLAT': accessTransformerNames.join(' ')
        }
        if (coremod_plugin_class) {
            attributes 'FMLCorePlugin': coremod_plugin_class
            if (coremod_includes_mod.toBoolean()) {
                attributes 'FMLCorePluginContainsFMLMod': true, 'ForceLoadAsMod': true
            }
        }
    }
}

tasks.withType(Checkstyle).configureEach {
    enabled = enable_checkstyle.toBoolean()
}

tasks.matching { it.name in ['clearSkiesCheck', 'formatJavaCheck'] }.configureEach {
    enabled = enable_formatting.toBoolean()
}

// TODO: fundamental Foundation issue
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}
